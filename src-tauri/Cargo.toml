[package]
name = "px-dev"
version = "0.1.0"
description = "PX Dev - 本地开发环境与项目进程管理工具"
authors = ["PX Dev Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "px_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-store = "=2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
